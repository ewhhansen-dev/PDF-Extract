<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>Extract Content</h3>

  <div class="button-group primary">
    <h4>Pure Text (Typewriter)</h4>
    <button id="txt-page">Page to .txt</button>
    <button id="txt-selection">Selection to .txt</button>
    <button id="pdf-typewriter-page">Page to Typewriter PDF</button>
    <button id="pdf-typewriter-selection">Selection to Typewriter PDF</button>
  </div>

  <div class="button-group">
    <h4>Standard</h4>
    <button id="pdf-page">Page to Screenshot PDF</button>
    <button id="pdf-selection">Selection to Screenshot PDF</button>
    <button id="md-page">Page to Markdown</button>
    <button id="md-selection">Selection to Markdown</button>
  </div>

  <div id="error-msg" style="display:none;"></div>
  <script src="popup.js"></script>
</body>
</html>
